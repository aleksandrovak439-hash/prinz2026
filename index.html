<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Принц — Персонажи</title>

<style>
body {
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#0f0f0f;
  color:white;
}

h1 {
  text-align:center;
  margin:20px 0;
  font-size:22px;
}

.role-list { padding:10px; }

.role-card {
  background:#1c1c1e;
  margin-bottom:10px;
  padding:15px;
  border-radius:16px;
}

.role-date { color:#888; font-size:13px; }
.role-count { color:#aaa; font-size:12px; }

.actor-container {
  padding:10px;
  display:grid;
  gap:15px;
}

.actor-card {
  background:#1c1c1e;
  border-radius:16px;
  overflow:hidden;
}

.actor-card img {
  width:100%;
  object-fit:cover;
}

.actor-info { padding:12px; }

.name {
  font-size:17px;
  font-weight:600;
}

.btn {
  margin-top:10px;
  padding:12px;
  background:#ff3b30;
  border:none;
  border-radius:12px;
  width:100%;
  color:white;
  cursor:pointer;
}

.back {
  padding:10px;
  color:#888;
  cursor:pointer;
}

/* УТВЕРЖДЕННЫЕ */
.approved-container { padding:10px; }

.approved-row {
  display:flex;
  gap:10px;
  margin-bottom:12px;
  background:#1c1c1e;
  padding:10px;
  border-radius:12px;
  align-items:center;
}

.approved-row img {
  width:70px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}

.approved-info {
  font-size:13px;
  line-height:1.4;
}

.carousel {
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
}

.carousel img {
  width:100%;
  flex-shrink:0;
  scroll-snap-align:center;
}
</style>
</head>

<body>

<div id="home">
<h1>Проект "Принц"</h1>
<div class="role-list" id="roleList"></div>
</div>

<div id="actorPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="actor-container" id="actorContainer"></div>
</div>

<div id="approvedPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="approved-container" id="approvedContainer"></div>
</div>

<script>

// УТВЕРЖДЕННЫЕ
const approved = [];

// АКТЕРЫ
const data = {

"Дрессировщик":[
   {
    name:"Дружинин Павел",
    img:"photos/Дружинин.jpg",
    age:"39 лет",
    height:"165 см",
    edu:"ШРД им. И.О. Горбачева, 2015",
    ft:"https://casting.filmtoolz.ru/3119201/",
    video:"https://casting.filmtoolz.ru/3119201/?modal=actor#video-cp152523"
  },
  {
    name:"Шихалеев Сергей",
    img:"photos/Шихалеев.jpg",
    age:"36 лет",
    height:"165 см",
    edu:"РГИСИ, мастерская Р. Камхена",
    ft:"https://casting.filmtoolz.ru/3566324/",
    video:"https://casting.filmtoolz.ru/3566324/?modal=actor#video"
  },
  {
    name:"Опря Макс",
    img:"photos/Опря.jpg",
    age:"27 лет",
    height:"165 см",
    edu:"Свердловский колледж искусств и культуры",
    ft:"https://www.kinopoisk.ru/name/10395315/",
    video:"https://disk.yandex.ru/i/MflOCm4rlkcUKA"
  },
  {
    name:"Бызгу Фома",
    img:"photos/Бызгу.jpg",
    age:"30 лет",
    height:"165 см",
    edu:"РГИСИ 2018",
    ft:"https://casting.filmtoolz.ru/3161196/",
    video:"https://casting.filmtoolz.ru/3161196/?modal=actor#video"
  }
],

"Кудрявая девушка с пуделем":[
{
  name:"Зарбалиева Сабина",
  img:"photos/Сабина.jpg",
  img2:"photos/пудельМакс.jpg",
  info:"пудель Максим",
  size:"171/44"
}
],

"Толстый мужчина с английским бульдогом":[
{
  name:"Мужчина с бульдогом",
  img:"photos/мужчина.jpg",
  img2:"photos/бульдог.jpg",
  info:"английский бульдог",
  size:"---"
}
],

"Хозяйка Молли":[],
"Ольга Львовна":[],
"Ведущий":[],
"Охранник":[],
"Фотограф":[],
"Мама ребенка":[],
"Ребенок":[],
"Менеджер ресторана":[],
"Повар":[],
"дублер Папы":[],
"дублер Мамы":[],
"дублер Сын":[]
};

const roleList = document.getElementById('roleList');

// УТВЕРЖДЕННЫЕ
const approvedDiv = document.createElement('div');
approvedDiv.className='role-card';
approvedDiv.innerHTML = `<strong>✅ УТВЕРЖДЕННЫЕ</strong>`;
approvedDiv.onclick = openApproved;
roleList.appendChild(approvedDiv);

// роли
for(let role in data){
  const div = document.createElement('div');
  div.className='role-card';

  div.innerHTML = `
    <strong>${role}</strong>
    <div class="role-count">Проб: ${data[role].length}</div>
  `;

  div.onclick = ()=>openRole(role);
  roleList.appendChild(div);
}

// открыть роль
function openRole(role){
  const list = data[role];

  if(list.length===0){
    alert('Проб пока нет');
    return;
  }

  document.getElementById('home').style.display='none';
  document.getElementById('actorPage').style.display='block';

  const container = document.getElementById('actorContainer');
  container.innerHTML='';

  list.forEach(actor=>{
    const card = document.createElement('div');

    // 👉 ТОЛЬКО если есть img2 → 2 фото
    const photos = actor.img2 
  	? `<div class="carousel">
       		<img src="${actor.img}">
       		<img src="${actor.img2}">
     		</div>`
  	: `<img src="${actor.img}">`;

    card.innerHTML = `
      <div class="actor-card">
        ${photos}

        <div class="actor-info">
          <div class="name">${actor.name}</div>

          ${actor.info ? `<div class="role-date">${actor.info}</div>` : ''}
          ${actor.size ? `<div class="role-date">${actor.size}</div>` : ''}

          ${actor.age ? `<div class="role-date">Возраст: ${actor.age}</div>` : ''}
          ${actor.height ? `<div class="role-date">Рост: ${actor.height}</div>` : ''}
          ${actor.edu ? `<div class="role-date">${actor.edu}</div>` : ''}

          ${actor.ft ? `<button class="btn" onclick="window.open('${actor.ft}')">Анкета</button>` : ''}
          ${actor.video ? `<button class="btn" onclick="window.open('${actor.video}')">Видео</button>` : ''}
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

function openApproved(){
  alert("Пока пусто");
}

function goBack(){
  document.getElementById('actorPage').style.display='none';
  document.getElementById('home').style.display='block';
}

</script>

</body>
</html>
