<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Принц — Персонажи</title>

<style>
body {
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#0f0f0f;
  color:white;
}

h1 {
  text-align:center;
  margin:20px 0;
  font-size:22px;
}

.role-list { padding:10px; }

.role-card {
  background:#1c1c1e;
  margin-bottom:10px;
  padding:15px;
  border-radius:16px;
}

.role-count {
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}

.actor-container {
  padding:10px;
  display:grid;
  gap:15px;
}

.actor-card {
  background:#1c1c1e;
  border-radius:16px;
  overflow:hidden;
}

/* CAROUSEL */
.carousel {
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
}

.carousel img {
  width:100%;
  flex-shrink:0;
  scroll-snap-align:center;
}

/* DOTS */
.dots {
  display:flex;
  justify-content:center;
  gap:6px;
  margin:6px 0 10px;
}

.dot {
  width:6px;
  height:6px;
  border-radius:50%;
  background:#444;
}

.dot.active {
  background:#ff3b30;
}

.actor-info { padding:12px; }

.name {
  font-size:17px;
  font-weight:600;
}

.btn {
  margin-top:10px;
  padding:12px;
  background:#ff3b30;
  border:none;
  border-radius:12px;
  width:100%;
  color:white;
}

.back {
  padding:10px;
  color:#888;
}

/* LISTS */
.approved-container { padding:10px; }

.approved-row {
  display:flex;
  gap:10px;
  margin-bottom:12px;
  background:#1c1c1e;
  padding:10px;
  border-radius:12px;
  align-items:flex-start;
}

.approved-row img {
  width:70px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}

.approved-info {
  font-size:13px;
  line-height:1.4;
}
</style>
</head>

<body>

<div id="home">
<h1>Проект "Принц"</h1>
<div class="role-list" id="roleList"></div>
</div>

<div id="actorPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="actor-container" id="actorContainer"></div>
</div>

<div id="approvedPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="approved-container" id="approvedContainer"></div>
</div>

<div id="viewedPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="approved-container" id="viewedContainer"></div>
</div>

<script>

// 🔥 УТВЕРЖДЕННЫЕ
const approved = [];

// 🔥 ПРОСМОТРЕННЫЕ
const viewed = [

},
{
    name:"Шихалеев Сергей",

    size:"165 см",

},
{
    name:"Опря Макс",
    img:"photos/Опря.jpg",

    video:"https://disk.yandex.ru/i/MflOCm4rlkcUKA"
},
{
    name:"Бызгу Фома",

    age:"30 лет",
    size:"165 см",
    video:"https://casting.filmtoolz.ru/3161196/"
}
];

// ВСЕ ПЕРСОНАЖИ
const data = {

"Дрессировщик":[],

"Кудрявая девушка с пуделем":[
{
  name:"Зарбалиева Сабина",
  img:"photos/Сабина.jpg",
  img2:"photos/пудельМакс.jpg",
  size:"171/44",
  video:"https://disk.yandex.ru/d/XcqkLtlzmqzW2w"
}
],

"Толстый мужчина с английским бульдогом":[],

"Хозяйка Молли":[
{
  name:"Герасименко Валерия",
  img:"photos/Герсасименко.jpg",
  img2:"photos/Герасименко1.jpg",
  age:"27 лет",
  size:"165 / 40 / 36",
  video:"https://disk.yandex.ru/i/r772WG3WRJVesA"
},
{
  name:"Степанова Александра",
  img:"photos/Степанова.jpg",
  img2:"photos/Степанова1.jpg",
  age:"27 лет",
  size:"173 / 42-44 / 38",
  video:"https://disk.yandex.ru/i/fxueivOjgjxzmg"
},
{
  name:"Ткачева Катя",
  img:"photos/Ткачева.jpg",
  img2:"photos/Ткачева1.jpg",
  age:"33 года",
  size:"178 / 42 / 40",
  video:"https://disk.yandex.ru/i/NKGcTYsGO8IWbQ"
},
{
  name:"Тая Федянина",
  img:"photos/Федянина.jpg",
  img2:"photos/Федянина1.jpg",
  age:"27 лет",
  size:"170 / 44 / 38",
  video:"https://casting.filmtoolz.ru/4014928/?modal=actor#video-cp174325"
},
{
  name:"Лыскова Евгения",
  img:"photos/Лыскова.jpg",
  img2:"photos/Лыскова1.jpg",
  size:"175 / 44 / 40",
  video:"https://disk.yandex.ru/i/RbCxFTV-ajpHLA"
},
{
  name:"Мария Перн",
  img:"photos/Перн.jpg",
  img2:"photos/Перн1.jpg",
  age:"36 лет",
  size:"170",
  video:"https://casting.filmtoolz.ru/3118160/?modal=actor#video-cp143848"
}
],

"Ольга Львовна":[],
"Ведущий":[],
"Охранник":[],
"Фотограф":[],
"Мама ребенка":[],
"Ребенок":[],
"Менеджер ресторана":[],
"Повар":[],
"дублер Папы":[],
"дублер Мамы":[],
"дублер Сын":[]
};

const roleList=document.getElementById('roleList');

// вкладки
const approvedDiv=document.createElement('div');
approvedDiv.className='role-card';
approvedDiv.innerHTML='✅ УТВЕРЖДЕННЫЕ';
approvedDiv.onclick=openApproved;
roleList.appendChild(approvedDiv);

const viewedDiv=document.createElement('div');
viewedDiv.className='role-card';
viewedDiv.innerHTML='👁 ПРОСМОТРЕННЫЕ';
viewedDiv.onclick=openViewed;
roleList.appendChild(viewedDiv);

// роли
for(let role in data){
  const div=document.createElement('div');
  div.className='role-card';

  div.innerHTML=`
    <strong>${role}</strong>
    <div class="role-count">Проб: ${data[role].length}</div>
  `;

  div.onclick=()=>openRole(role);
  roleList.appendChild(div);
}

// роли
function openRole(role){
  const list=data[role];

  document.getElementById('home').style.display='none';
  document.getElementById('actorPage').style.display='block';

  const container=document.getElementById('actorContainer');
  container.innerHTML='';

  if(list.length===0){
    container.innerHTML='Пусто';
    return;
  }

  list.forEach(actor=>{
    const photos=actor.img2
    ? `<div class="carousel">
        <img src="${actor.img}">
        <img src="${actor.img2}">
      </div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>`
    : `<img src="${actor.img}">`;

    const card=document.createElement('div');
    card.innerHTML=`
      <div class="actor-card">
        ${photos}
        <div class="actor-info">
          <div class="name">${actor.name}</div>
          ${actor.age?`<div>Возраст: ${actor.age}</div>`:''}
          ${actor.size?`<div>${actor.size}</div>`:''}
          ${actor.video?`<button class="btn" onclick="window.open('${actor.video}')">Видео</button>`:''}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// просмотренные
function openViewed(){
  document.getElementById('home').style.display='none';
  document.getElementById('viewedPage').style.display='block';

  const container=document.getElementById('viewedContainer');
  container.innerHTML='';

  viewed.forEach(a=>{
    const row=document.createElement('div');
    row.className='approved-row';

    row.innerHTML=`
      <img src="${a.img}">
      <div class="approved-info">
        <div><strong>${a.name}</strong></div>
        <div>Возраст: ${a.age || '-'}</div>
        <div>Размеры: ${a.size || '-'}</div>
        ${a.video?`<button class="btn" onclick="window.open('${a.video}')">Видео</button>`:''}
      </div>
    `;
    container.appendChild(row);
  });
}

// утвержденные
function openApproved(){
  document.getElementById('home').style.display='none';
  document.getElementById('approvedPage').style.display='block';

  const container=document.getElementById('approvedContainer');
  container.innerHTML='Пусто';
}

// назад
function goBack(){
  document.getElementById('actorPage').style.display='none';
  document.getElementById('approvedPage').style.display='none';
  document.getElementById('viewedPage').style.display='none';
  document.getElementById('home').style.display='block';
}

</script>

</body>
</html>
