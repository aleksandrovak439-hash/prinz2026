<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Принц — Персонажи</title>

<style>
body {
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#0f0f0f;
  color:white;
}

h1 {
  text-align:center;
  margin:16px 0;
  font-size:20px;
}

.role-list { padding:10px; }

.role-card {
  background:#1c1c1e;
  margin-bottom:10px;
  padding:14px;
  border-radius:14px;
}

.role-count {
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.actor-container {
  padding:10px;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:12px;
}

.actor-card {
  background:#1c1c1e;
  border-radius:14px;
  overflow:hidden;
}

.actor-card img {
  width:100%;
  height:220px;
  object-fit:cover;
}

.carousel {
  display:flex;
  overflow-x:auto;
}

.carousel img {
  width:100%;
  height:220px;
  flex-shrink:0;
  object-fit:cover;
}

.actor-info {
  padding:10px;
}

.name {
  font-size:14px;
  font-weight:600;
}

.btn {
  margin-top:8px;
  padding:10px;
  background:#ff3b30;
  border:none;
  border-radius:10px;
  width:100%;
  color:white;
  font-size:13px;
}

.back {
  padding:10px;
  color:#888;
}

.approved-container { padding:10px; }

.approved-row {
  display:flex;
  gap:10px;
  margin-bottom:10px;
  background:#1c1c1e;
  padding:10px;
  border-radius:12px;
}

.approved-row img {
  width:70px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}

.approved-info {
  font-size:13px;
}
</style>
</head>

<body>

<div id="home">
<h1>Проект "Принц"</h1>
<div class="role-list" id="roleList"></div>
</div>

<div id="actorPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="actor-container" id="actorContainer"></div>
</div>

<div id="approvedPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="approved-container" id="approvedContainer"></div>
</div>

<div id="viewedPage" style="display:none;">
<div class="back" onclick="goBack()">← Назад</div>
<div class="approved-container" id="viewedContainer"></div>
</div>

<script>

// УТВЕРЖДЕННЫЕ
const approved = [
{ role:"Хозяйка Молли", name:"Тая Федянина", img:"photos/Федянина1.jpg", size:"170 / 44 / 38" },
{ role:"Дачник", name:"Гульнев Дмитрий", img:"photos/Гульнев1.jpg", size:"175/48/41" }
];

// ПРОСМОТРЕННЫЕ
const viewed = [
{ name:"Дружинин Павел", img:"photos/Дружинин.jpg", age:"39 лет", size:"165 см", video:"https://casting.filmtoolz.ru/3119201/" },
{ name:"Шихалеев Сергей", img:"photos/Шихалеев.jpg", age:"36 лет", size:"165 см", video:"https://casting.filmtoolz.ru/3566324/" },
{ name:"Опря Макс", img:"photos/Опря.jpg", age:"27 лет", size:"165 см", video:"https://disk.yandex.ru/i/MflOCm4rlkcUKA" },
{ name:"Бызгу Фома", img:"photos/Бызгу.jpg", age:"30 лет", size:"165 см", video:"https://casting.filmtoolz.ru/3161196/" },

// добавлены 
{ name:"Герасименко Валерия",
  img:"photos/Герсасименко.jpg",
  age:"27 лет",
  size:"165 / 40 / 36",
  video:"https://disk.yandex.ru/i/r772WG3WRJVesA"
},
{
  name:"Степанова Александра",
  img:"photos/Степанова.jpg",
  age:"27 лет",
  size:"173 / 42-44 / 38",
  video:"https://disk.yandex.ru/i/fxueivOjgjxzmg"
},
{
  name:"Ткачева Катя",
  img:"photos/Ткачева.jpg",
  age:"33 года",
  size:"178 / 42 / 40",
  video:"https://disk.yandex.ru/i/NKGcTYsGO8IWbQ"
},
{
  name:"Лыскова Евгения",
  img:"photos/Лыскова.jpg",
  size:"175 / 44 / 40",
  video:"https://disk.yandex.ru/i/RbCxFTV-ajpHLA"
},
{
  name:"Мария Перн",
  img:"photos/Перн.jpg",
  age:"36 лет",
  size:"170",
  video:"https://casting.filmtoolz.ru/3118160/?modal=actor#video-cp143848"
}
];

// DATA
const data = {

"Кудрявая девушка с пуделем":[
{ name:"Зарбалиева Сабина", img:"photos/Сабина.jpg", img2:"photos/пудельМакс.jpg", size:"171/44", video:"https://disk.yandex.ru/d/XcqkLtlzmqzW2w" }
],

"Толстый мужчина с английским бульдогом":[],

"Ольга Львовна":[
{ name:"Орлова Людмила", img:"photos/Орлова.jpg", age:"47 лет", size:"164/44/37", video:"https://disk.yandex.com/i/koblFHKk9nzJug" },
{ name:"Медведева Лия", img:"photos/Медведева.jpg", age:"57 лет", video:"https://disk.yandex.ru/i/lkJKc6DlnHBZtQ" },
{ name:"Ольга Кот", img:"photos/Кот.jpg", video:"https://disk.yandex.ru/i/wvs5pVCrg-BXuQ" },
{ name:"Минязова Аделина", img:"photos/Минязова.jpg", img2:"photos/Минязова1.jpg", age:"47 лет", video:"https://disk.yandex.ru/i/K5KXXge9DD_Z-w" },
{ name:"Свирко Елена", img:"photos/Свирко.jpg", age:"58 лет", video:"https://vk.com/away.php?to=https%3A%2F%2Fdisk.yandex.ru%2Fd%2Fy0-1yanQbw3IsA&utf=1" },
{ name:"Мария Клешнина", img:"photos/Клешнина.jpg", img2:"photos/Клешнина1.jpg", video:"https://disk.yandex.ru/i/HOamNPTs4WT-2Q" },
{ name:"Сдобникова Лариса", img:"photos/Сдобникова.jpg", img2:"photos/Сдобникова1.jpg", video:"https://disk.yandex.ru/i/LHwXMBSKlgC8ug" }
],

"Ведущий":[],
"Охранник":[],
"Фотограф":[],
"Мама ребенка":[],
"Ребенок":[],
"Менеджер ресторана":[],
"Повар":[],
"дублер Папы":[],
"дублер Мамы":[],
"дублер Сын":[]
};

const roleList=document.getElementById('roleList');

// вкладки
const approvedDiv=document.createElement('div');
approvedDiv.className='role-card';
approvedDiv.innerHTML='✅ УТВЕРЖДЕННЫЕ';
approvedDiv.onclick=openApproved;
roleList.appendChild(approvedDiv);

const viewedDiv=document.createElement('div');
viewedDiv.className='role-card';
viewedDiv.innerHTML='👁 ПРОСМОТРЕННЫЕ';
viewedDiv.onclick=openViewed;
roleList.appendChild(viewedDiv);

// роли
for(let role in data){
  const div=document.createElement('div');
  div.className='role-card';
  div.innerHTML=`<strong>${role}</strong><div class="role-count">Проб: ${data[role].length}</div>`;
  div.onclick=()=>openRole(role);
  roleList.appendChild(div);
}

// функции
function openRole(role){
  const list=data[role];
  document.getElementById('home').style.display='none';
  document.getElementById('actorPage').style.display='block';

  const container=document.getElementById('actorContainer');
  container.innerHTML='';

  if(list.length===0){
    container.innerHTML='Пусто';
    return;
  }

  list.forEach(actor=>{
    const photos=actor.img2
      ? `<div class="carousel"><img src="${actor.img}"><img src="${actor.img2}"></div>`
      : `<img src="${actor.img}">`;

    container.innerHTML+=`
      <div class="actor-card">
        ${photos}
        <div class="actor-info">
          <div class="name">${actor.name}</div>
          ${actor.age?`<div>${actor.age}</div>`:''}
          ${actor.size?`<div>${actor.size}</div>`:''}
          ${actor.video?`<button class="btn" onclick="window.open('${actor.video}')">Видео</button>`:''}
        </div>
      </div>
    `;
  });
}

function openApproved(){
  document.getElementById('home').style.display='none';
  document.getElementById('approvedPage').style.display='block';

  const container=document.getElementById('approvedContainer');
  container.innerHTML='';

  approved.forEach(a=>{
    container.innerHTML+=`
      <div class="approved-row">
        <img src="${a.img}">
        <div class="approved-info">
          <div><strong>${a.role}</strong></div>
          <div>${a.name}</div>
          <div>${a.size}</div>
        </div>
      </div>
    `;
  });
}

function openViewed(){
  document.getElementById('home').style.display='none';
  document.getElementById('viewedPage').style.display='block';

  const container=document.getElementById('viewedContainer');
  container.innerHTML='';

  viewed.forEach(a=>{
    container.innerHTML+=`
      <div class="approved-row">
        <img src="${a.img}">
        <div class="approved-info">
          <div><strong>${a.name}</strong></div>
          <div>${a.age || '-'}</div>
          <div>${a.size || '-'}</div>
        </div>
      </div>
    `;
  });
}

function goBack(){
  document.getElementById('actorPage').style.display='none';
  document.getElementById('approvedPage').style.display='none';
  document.getElementById('viewedPage').style.display='none';
  document.getElementById('home').style.display='block';
}

</script>

</body>
</html>
